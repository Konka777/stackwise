<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stackwise</title><style>
:root{--ink:#1d2433;--muted:#687185;--paper:#fbfaf7;--line:#e7e4dc;--navy:#273a66;--blue:#5485dd;--gold:#e5b64c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#eef4ff 0,transparent 34%),var(--paper);color:var(--ink);font-family:Arial,sans-serif}.app{min-height:100vh;display:flex;flex-direction:column}.bar,footer{width:min(980px,calc(100% - 40px));margin:auto;display:flex;justify-content:space-between;align-items:center}.bar{height:76px;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}.brand{font-size:18px;font-weight:700;color:var(--navy);display:flex;gap:9px;align-items:center}.mark{display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:var(--navy);color:white;font-family:Georgia}.status{display:flex;gap:7px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#57a476}.study{width:min(760px,calc(100% - 40px));margin:auto;padding:50px 0 38px;text-align:center}.eyebrow{color:var(--blue);letter-spacing:1.7px;font-weight:bold;font-size:11px}.study h1{margin:12px 0 0;color:var(--navy);font:clamp(34px,6vw,52px) Georgia,serif;letter-spacing:-1.8px}.subtitle{color:var(--muted);margin:12px 0 34px}.card{min-height:390px;overflow:hidden;text-align:left;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 17px 45px #23315017}.cardhead{padding:16px 23px;display:flex;justify-content:space-between;border-bottom:1px solid #efede8;color:#8991a0;font-size:11px;font-weight:bold;letter-spacing:1px}.content{padding:38px 48px}.question{font:24px/1.45 Georgia,serif;color:#313a4d;margin:0}.hint{margin-top:31px;padding:10px 14px;border-left:3px solid var(--gold);background:#fffbef;color:#625b48;font-size:14px}.hint b{color:#a77b19;margin-right:8px}.show{margin-top:92px;float:right;border:0;border-radius:9px;padding:12px 17px;background:var(--navy);color:white;font-weight:bold}.answer p{color:#495267;line-height:1.5}.answer pre{padding:20px;overflow:auto;border-radius:11px;background:#192233;color:#eaf0ff;font:13px/1.55 ui-monospace,monospace}.complex{font-size:14px!important;color:var(--muted)!important}.ratings{margin-top:21px}.ratings p{color:var(--muted);font-size:14px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.rate{padding:10px 6px;border:1px solid var(--line);border-radius:10px;background:white;text-transform:capitalize}.rate strong,.rate span{display:block}.rate span{font-size:11px;color:var(--muted);margin-top:4px}footer{padding:19px 0 25px;color:#8b93a1;font-size:12px}footer button{border:0;background:transparent;color:#7c8595;text-decoration:underline}@media(max-width:600px){.bar,footer,.study{width:calc(100% - 28px)}.content{padding:28px 23px}.question{font-size:21px}.buttons{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="app"><header class="bar"><div class="brand"><span class="mark">S</span>Stackwise</div><div class="status"><i class="dot"></i><span id="due">Loading…</span></div></header><section class="study"><p class="eyebrow" id="topic"></p><h1 id="title"></h1><p class="subtitle" id="subtitle"></p><article class="card"><div class="cardhead"><span id="side">PROMPT</span><span id="number"></span></div><div class="content" id="content"></div></article><div id="ratings" class="ratings" hidden><p>How well did you remember it?</p><div class="buttons"><button class="rate" data-review="again"><strong>Again</strong><span>1 min</span></button><button class="rate" data-review="hard"><strong>Hard</strong><span>10 min</span></button><button class="rate" data-review="good"><strong>Good</strong><span>1 day</span></button><button class="rate" data-review="easy"><strong>Easy</strong><span>4 days</span></button></div><button class="show" id="skip">Skip — next card →</button></div></section><footer><span id="stats"></span><button id="reset">Reset card</button></footer></main><script>
const wait={again:1,hard:10,good:1440,easy:5760};let data,card,shown=false;const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function due(){const m=Math.ceil((card.dueAt-Date.now())/60000);return m<=0?'Ready now':m<60?`Due in ${m} min`:m<2880?`Due in ${Math.ceil(m/60)} hr`:`Due in ${Math.ceil(m/1440)} days`}async function save(){await fetch('/api/cards',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(data)})}function nextCard(skip=false){const cards=data.cards.slice().sort((a,b)=>a.dueAt-b.dueAt);const index=cards.findIndex(item=>item.id===card?.id);card=skip?cards[(index+1+cards.length)%cards.length]:cards[0]}function render(){document.querySelector('#due').textContent=due();document.querySelector('#topic').textContent='CODING INTERVIEW PRACTICE';document.querySelector('#title').textContent=card.title;document.querySelector('#subtitle').textContent=`LeetCode problem #${card.number} · ${card.difficulty}`;document.querySelector('#number').textContent=`LEETCODE #${card.number} · 01 / ${data.cards.length}`;document.querySelector('#side').textContent=shown?'ANSWER':'PROMPT';document.querySelector('#stats').textContent=`${card.reviews} completed review${card.reviews===1?'':'s'}${card.lastReview?' · Last: '+card.lastReview:''}`;document.querySelector('#ratings').hidden=!shown;document.querySelector('#content').innerHTML=shown?`<div class="answer"><p><b>TYPE · ${esc(card.questionType)}</b></p><p>${esc(card.answer)}</p><pre>${esc(card.code)}</pre><p class="complex"><b>${esc(card.complexity.split('. ')[0])}.</b> ${esc(card.complexity.split('. ').slice(1).join('. '))}</p></div>`:`<p class="question">${esc(card.prompt)}</p><div class="hint"><b>Hint</b>Focus on what information you need from earlier elements.</div><button class="show" id="show">Show answer →</button><button class="show" id="skip">Skip — next card →</button>`;const show=document.querySelector('#show');if(show)show.onclick=()=>{shown=true;render()};const skip=document.querySelector('#skip');if(skip)skip.onclick=()=>{shown=false;nextCard(true);render()}}async function start(){data=await fetch('/api/cards').then(r=>r.json());nextCard();render()}document.querySelectorAll('[data-review]').forEach(b=>b.onclick=async()=>{const r=b.dataset.review;card.dueAt=Date.now()+wait[r]*60000;card.reviews++;card.lastReview=r;shown=false;await save();nextCard();render()});document.querySelector('#reset').onclick=async()=>{card.dueAt=0;card.reviews=0;card.lastReview=null;shown=false;await save();render()};start();
</script><script>
const renderCard = render;
render = function () {
  renderCard();
  if (shown || !card?.examples?.length) return;
  const examples = card.examples.map((item, index) => `<div><b>Example ${index + 1}:</b> Input: <code>${esc(item.input)}</code> → Output: <code>${esc(item.output)}</code></div>`).join("");
  document.querySelector(".hint")?.insertAdjacentHTML("beforebegin", `<div style="margin-top:20px;padding:14px;border-radius:10px;background:#f7f8fc;color:#3e4960;font-size:13px;line-height:1.7">${examples}</div>`);
};
setTimeout(() => { if (data) render(); }, 0);
</script><script>
const renderWithExamples = render;
function previousCard() {
  const cards = data.cards.slice().sort((a, b) => a.dueAt - b.dueAt);
  const index = cards.findIndex((item) => item.id === card.id);
  card = cards[(index - 1 + cards.length) % cards.length];
}
render = function () {
  renderWithExamples();
  const controls = `<div style="clear:both;padding-top:20px;display:flex;gap:10px;justify-content:flex-end"><button id="back" style="border:1px solid #d9deea;border-radius:9px;padding:10px 14px;background:white;color:#273a66;font-weight:bold">← Back to question</button><button id="previous" style="border:1px solid #d9deea;border-radius:9px;padding:10px 14px;background:white;color:#273a66;font-weight:bold">← Previous card</button></div>`;
  if (shown) document.querySelector(".answer")?.insertAdjacentHTML("beforeend", controls);
  else document.querySelector("#content")?.insertAdjacentHTML("beforeend", controls.replace('<button id="back" style="border:1px solid #d9deea;border-radius:9px;padding:10px 14px;background:white;color:#273a66;font-weight:bold">← Back to question</button>', ""));
  document.querySelector("#back")?.addEventListener("click", () => { shown = false; render(); });
  document.querySelector("#previous")?.addEventListener("click", () => { shown = false; previousCard(); render(); });
};
setTimeout(() => { if (data) render(); }, 0);
</script><script>
const renderWithNavigation = render;
render = function () {
  renderWithNavigation();
  document.querySelectorAll("#skip").forEach((button) => { button.textContent = "Skip"; button.style.marginLeft = "12px"; });
  const show = document.querySelector("#show");
  if (show) show.style.marginRight = "12px";
};
setTimeout(() => { if (data) render(); }, 0);
</script></body></html>
